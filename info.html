<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clickable Commas + Refresh</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="fixed-top-right">
        info
        <a href="page.html" data-info="publication">,</a>
        <a href="upcoming.html" data-info="upcoming">,</a>

    </div>

    <p class="container">Com,,,a is a loose online-based publishing group.
        We began our activities in early 2025. </p>

    <!-- Stays forever; click → plays refresh.mp3 + reload -->
    <button class="clickable refresh" type="button" aria-label="Refresh page"
        onclick="refreshWithSound()">refresh</button>


    <div class="gallery-wrapper">
        <button class="nav prev" id="prev">‹</button>

        <div class="h-scroll" id="gallery">
            <img src="./imggallery/8ball.png" alt="8ball">
            <img src="./imggallery/heart.png" alt="heart">
            <img src="./imggallery/la.png" alt="la">
            <img src="./imggallery/ny.png" alt="ny">
            <img src="./imggallery/tokyo.png" alt="tokyo">
            <img src="./imggallery/cdmx.png" alt="cdmx">
        </div>

        <button class="nav next" id="next">›</button>
    </div>

    <a href="index.html" class="back-btn">back</a>

    <script>
        function playClick() {
            const audio = new Audio('click.mp3');
            audio.play();
        }


        function refreshWithSound() {
            const audio = new Audio('refresh.mp3');
            audio.play();
            setTimeout(() => {
                window.location.reload();
            }, 4000);
        }
    </script>

    <script>
        const gallery = document.getElementById('gallery');
        const slides = gallery.querySelectorAll('img');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');

        function getIndex() {
            return Math.round(gallery.scrollLeft / gallery.clientWidth);
        }

        function scrollToIndex(i) {
            gallery.scrollTo({
                left: i * gallery.clientWidth,
                behavior: 'smooth'
            });
        }

        prevBtn.onclick = () => scrollToIndex(getIndex() - 1);
        nextBtn.onclick = () => scrollToIndex(getIndex() + 1);
    </script>
</body>

</html>
